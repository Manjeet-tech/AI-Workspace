[project]
name = "my-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manjeeth_Kumar", email = "manjeeth.kumar@dellteam.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-generativeai>=0.8.6",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
my-ai-agent = "my_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
